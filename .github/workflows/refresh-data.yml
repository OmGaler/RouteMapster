name: Refresh data

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch TfL bus route geometry
        run: python scripts/fetch_bus_routes.py

      - name: Process route geometry
        run: python scripts/process_routes_xml_to_geojson.py

      - name: Fetch bus stops
        run: python scripts/fetch_bus_stops.py

      - name: Fetch garages
        run: python scripts/fetch_and_process_garages.py

      - name: Commit changes
        shell: bash
        run: |
          changes=$(git diff --name-only -- data/processed)
          if [ -z "$changes" ]; then
            echo "No processed data changes."
            exit 0
          fi

          git config user.name "routemapster-bot"
          git config user.email "routemapster-bot@users.noreply.github.com"

          summary=$(python scripts/changes.py)

          git add data/processed
          git commit -m "$summary"
          git push
