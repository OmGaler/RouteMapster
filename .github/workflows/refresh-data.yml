name: Refresh data

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

env:
  DESTINATION_REVIEWER: OmGaler

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TFL_APP_ID: ${{ secrets.TFL_APP_ID }}
      TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.ROUTEMAPSTER_PR_TOKEN || github.token }}

      - name: Update checkout from the target branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-dev.txt

      - name: Fetch TfL bus route geometry
        run: python scripts/fetch_bus_routes.py

      - name: Process route geometry
        run: python scripts/process_routes_xml_to_geojson.py

      - name: Fetch bus stops
        run: python scripts/fetch_bus_stops.py

      - name: Build timetable frequency cache
        run: python scripts/build_frequency_cache.py

      - name: Fetch garages
        run: python scripts/fetch_and_process_garages.py --base data/garages-base.geojson

      - name: Fetch route destinations
        shell: bash
        run: |
          set -euo pipefail

          routes=$(python scripts/changes.py --destination-refresh-routes)
          if [ -z "$routes" ]; then
            echo "No new or geometry-updated routes; keeping existing route destination cache."
            exit 0
          fi

          python scripts/fetch_route_destinations.py --line-ids "$routes"

      - name: Build route summary
        run: python scripts/build_route_summary.py

      - name: Run tests
        shell: bash
        run: |
          set +e

          mkdir -p test-results
          python -m pytest -q 2>&1 | tee test-results/pytest.log
          status=${PIPESTATUS[0]}

          {
            echo "### Test results"
            echo
            if [ "$status" -eq 0 ]; then
              echo "- Unit tests passed."
            else
              echo "- Unit tests failed with exit code $status. Data refresh will continue."
            fi
            echo
            echo '```'
            tail -n 80 test-results/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: test-results/pytest.log
          if-no-files-found: ignore

      - name: Commit non-destination changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROUTEMAPSTER_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config user.name "routemapster-bot"
          git config user.email "routemapster-bot@users.noreply.github.com"

          has_destination_changes=0
          if ! git diff --quiet HEAD -- data/processed/route_destinations.json; then
            has_destination_changes=1
            mkdir -p /tmp/routemapster-destination-review
            cp data/processed/route_destinations.json /tmp/routemapster-destination-review/route_destinations.json

            git restore --source=HEAD -- data/processed/route_destinations.json
            python scripts/build_route_summary.py
          fi

          python scripts/changes.py --details | tee data/processed/latest_change_log.md >> "$GITHUB_STEP_SUMMARY"

          # Detect changes in exactly what we intend to commit
          changes=$(git status --porcelain -- data/processed data/raw/stops/postcode_cache.json)
          real_changes=$(printf "%s\n" "$changes" | grep -v ' data/processed/latest_change_log.md$' || true)
          if [ -z "$real_changes" ]; then
            echo "No non-destination data changes."
          else
            summary=$(python scripts/changes.py --summary)
            msg="Data update: $summary"

            git add data/processed
            git add -f data/raw/stops/postcode_cache.json
            git commit -m "$msg"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          if [ "$has_destination_changes" -eq 0 ]; then
            exit 0
          fi

          branch="data/destination-review-${GITHUB_RUN_ID}"
          git restore --source=HEAD -- data/processed/route_summary.csv data/processed/latest_change_log.md
          git fetch origin "$GITHUB_REF_NAME"
          git switch -c "$branch" "origin/$GITHUB_REF_NAME"

          cp /tmp/routemapster-destination-review/route_destinations.json data/processed/route_destinations.json
          python scripts/build_route_summary.py
          python scripts/changes.py --details > data/processed/latest_change_log.md

          destination_changes=$(git status --porcelain -- data/processed/route_destinations.json)
          if [ -z "$destination_changes" ]; then
            echo "Destination cache changed during refresh but no review artefacts differ after rebuilding."
            exit 0
          fi

          git add data/processed/route_destinations.json
          git commit -m "Review route destination changes"
          git push --set-upstream origin "$branch"

          pr_url=$(gh pr create \
            --title "Review route destination changes" \
            --body-file data/processed/latest_change_log.md \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch")
          gh pr edit "$pr_url" --add-reviewer "$DESTINATION_REVIEWER"

      - name: Upload latest change log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-change-log
          path: data/processed/latest_change_log.md
          if-no-files-found: ignore

  rebuild-route-summary:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'data/destination-review-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged destination review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.ROUTEMAPSTER_PR_TOKEN || github.token }}

      - name: Update checkout from the target branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${{ github.event.pull_request.base.ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Rebuild and commit route summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "routemapster-bot"
          git config user.email "routemapster-bot@users.noreply.github.com"

          python scripts/build_route_summary.py
          if git diff --quiet -- data/processed/route_summary.csv; then
            echo "Route summary is already current."
            exit 0
          fi
          git add data/processed/route_summary.csv
          git commit -m "Rebuild route summary after destination review"
          git pull --rebase origin "${{ github.event.pull_request.base.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.base.ref }}"
